name: release

# A tag like v0.1.0 builds, tests and packs applesauce, creates a GitHub release
# with the .mcpb bundle and the npm tarball, and publishes the npm package.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC), which also signs the provenance

env:
  # Pinned on purpose. Change it deliberately, never to "latest".
  MCP_PUBLISHER_VERSION: v1.8.1

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    # The "release" environment holds MCP_PRIVATE_KEY and only accepts v* tags.
    environment: release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later. npm 12 has breaking changes, so stay on 11.
      - name: Update npm
        run: |
          npm install -g npm@11
          npm --version

      - name: Check versions and tag
        run: |
          scripts/version.sh --check
          version="$(scripts/version.sh)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version." >&2
            exit 1
          fi
          if grep -q TODO npm/package.json; then
            echo "npm/package.json still has TODO placeholders." >&2
            exit 1
          fi

      - name: Swift version
        run: swift --version

      - name: Lint
        run: xcrun swift-format lint --strict -r Sources Tests Package.swift

      - name: Test
        run: swift test

      - name: Build universal binary
        run: scripts/build-universal.sh

      - name: Smoke test
        run: |
          dist/applesauce --version
          { printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release","version":"1"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 2; } \
            | dist/applesauce | tee out.jsonl
          grep -q '"name":"doctor"' out.jsonl

      - name: Pack npm package
        run: scripts/pack-npm.sh

      - name: Pack mcpb bundle
        run: scripts/pack-mcpb.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(scripts/version.sh)"
          assets=("dist/applesauce-$version.mcpb" "dist/applesauce-$version.tgz")
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          # A re-run of the workflow must not fail on a release that exists. It replaces the assets.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "applesauce $version" \
              --generate-notes \
              ${flags[@]+"${flags[@]}"}
          fi

      # Trusted publishing: npm checks this repository and workflow through OIDC. No token is stored.
      # The trusted publisher on npmjs.com must name akshitanchan/applesauce and release.yml.
      - name: Publish to npm
        run: |
          version="$(scripts/version.sh)"
          flags=(--access public)
          # npm refuses a prerelease without an explicit tag.
          if [[ "$version" == *-* ]]; then flags+=(--tag next); fi
          # The ./ keeps npm from reading the path as a GitHub user/repo shorthand.
          npm publish "./dist/applesauce-$version.tgz" "${flags[@]}"

      # The MCP Registry checks the npm package's mcpName, so wait until npm's review makes the version public.
      - name: Wait for npm
        run: |
          version="$(scripts/version.sh)"
          expected="$(sed -n 's/^ *"name": *"\([^"]*\)".*/\1/p' server.json | head -n 1)"
          for _ in $(seq 1 60); do
            found="$(npm view "applesauce@$version" mcpName 2>/dev/null || true)"
            if [[ "$found" == "$expected" ]]; then echo "npm has applesauce@$version"; exit 0; fi
            sleep 30
          done
          echo "applesauce@$version did not appear on npm within 30 minutes." >&2
          exit 1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install mcp-publisher
        run: |
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          # The binary must be signed by the registry's own release workflow.
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      # The name com.akshitanchan/* is proven by a TXT record on akshitanchan.com.
      - name: Publish to the MCP Registry
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          ./mcp-publisher login dns --domain akshitanchan.com
          ./mcp-publisher publish
