name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Version check
        run: scripts/version.sh --check
      - name: Swift version
        run: swift --version
      - name: Lint
        run: xcrun swift-format lint --strict -r Sources Tests Package.swift
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Smoke test
        run: |
          scripts/sign.sh .build/debug/applesauce
          .build/debug/applesauce --version
          { printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 2; } \
            | .build/debug/applesauce | tee out.jsonl
          grep -q '"name":"doctor"' out.jsonl
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Release build and packages
        run: |
          scripts/build-universal.sh
          scripts/pack-npm.sh
          scripts/pack-mcpb.sh
          npm publish "./dist/applesauce-$(scripts/version.sh).tgz" --dry-run --access public
